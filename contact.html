<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact – Firecracker Wiener Nationals</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
  <header class="hero">
  <div class="header-row">
    <nav class="nav header-nav">
      <a href="watch.html" class="nav-box">Watch</a>
      <a href="race.html" class="nav-box">Race</a>
    </nav>

    <h1 class="site-title">
      Firecracker Wiener<br>
      <span>Nationals</span>
    </h1>

    <nav class="nav header-nav">
      <a href="team.html" class="nav-box">Our Team</a>
      <a href="index.html" class="nav-box">Home</a>
    </nav>
  </div>
</header>
  
<main>
  <section id="contact">
    <h2 style="text-align:center;">Contact Us</h2>

    <form
      action="https://formspree.io/f/xdaakgzq"
      method="POST"
      class="contact-form"
    >
      <div class="form-group">
        <input type="text" name="firstName" placeholder="First Name" required>
        <input type="text" name="lastName" placeholder="Last Name" required>
      </div>

      <input type="email" name="email" placeholder="Email Address" required>
      <input type="text" name="subject" placeholder="Subject" required>

      <textarea name="message" placeholder="Message" rows="5" required></textarea>

      <button type="submit" class="btn">Send Message</button>
    </form>
  </section>
</main>

  <!-- FOOTER -->
  <footer>
    <p>
      <a href="http://tillamookanimalshelter.org" target="_blank">
        Tillamook Animal Shelter
      </a>
    </p>
    <p class="footer-disclaimer">
      By order of the Oregon Dachshund Racing Commission the minimum wager
      on an individual wiener race is $10,000.
    </p>
  </footer>

</body>
</html>
