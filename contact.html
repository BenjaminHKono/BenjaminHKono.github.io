<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact – Firecracker Wiener Nationals</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <h1 class="site-title">Firecracker Wiener Nationals</h1>
  <nav class="nav">
    <a href="index.html" class="nav-box">Home</a>
    <a href="watch.html" class="nav-box">Watch</a>
    <a href="racer.html" class="nav-box">Racer</a>
    <a href="team.html" class="nav-box">Our Team</a>
  </nav>
</header>

<main>
  <section id="contact">
    <h2>Contact Us</h2>

    <form
      action="https://formspree.io/f/xdaakgzq"
      method="POST"
      class="contact-form"
    >
      <div class="form-group">
        <input type="text" name="firstName" placeholder="First Name" required>
        <input type="text" name="lastName" placeholder="Last Name" required>
      </div>

      <input type="email" name="email" placeholder="Email Address" required>
      <input type="text" name="subject" placeholder="Subject" required>

      <textarea name="message" placeholder="Message" rows="5" required></textarea>

      <button type="submit" class="btn">Send Message</button>
    </form>
  </section>
</main>

</body>
</html>
