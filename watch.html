<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact – Firecracker Wiener Nationals</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
  <header class="hero">
  <div class="header-row">
    <nav class="nav header-nav">
      <a href="index.html" class="nav-box">Home</a>
      <a href="race.html" class="nav-box">Race</a>
    </nav>

    <h1 class="site-title">
      Firecracker Wiener<br>
      <span>Nationals</span>
    </h1>

    <nav class="nav header-nav">
      <a href="team.html" class="nav-box">Our Team</a>
      <a href="contact.html" class="nav-box">Contact</a>
    </nav>
  </div>
</header>

<main style="padding: 3rem; text-align: center;">
  <h2>Contact Us</h2>

  <form class="contact-form">
    <div class="name-row">
      <input type="text" name="first_name" placeholder="First Name" required>
      <input type="text" name="last_name" placeholder="Last Name" required>
    </div>

    <input type="email" name="email" placeholder="Email Address" required>
    <input type="text" name="subject" placeholder="Subject" required>
    <textarea name="message" placeholder="Message" rows="5" required></textarea>

    <button type="submit">Submit</button>
  </form>
</main>

</body>
</html>
